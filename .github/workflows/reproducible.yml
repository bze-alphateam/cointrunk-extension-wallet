name: Reproducible build

# Proves the store package can be rebuilt byte-for-byte from the source package
# (BUILD.md): build + package the checkout, then unpack `pnpm package:source` in
# another directory, follow BUILD.md from scratch and compare the SHA-256 of
# each browser's extension zip (Chrome and Firefox) across the two builds.

on:
  push:
  pull_request:

jobs:
  reproducible:
    name: rebuild from source package · compare hashes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Build and package the checkout
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm package
          pnpm package:source
          (cd release && sha256sum cointrunk-wallet-*-chrome.zip cointrunk-wallet-*-firefox.zip) > "$RUNNER_TEMP/checkout.sha256"

      # A fresh directory with no .git, node_modules or dist/: exactly what a
      # store reviewer unpacks.
      - name: Rebuild from the source package
        run: |
          rebuild="$RUNNER_TEMP/rebuild"
          mkdir "$rebuild"
          unzip -q release/cointrunk-wallet-*-source.zip -d "$rebuild"
          cd "$rebuild"/cointrunk-wallet-*-source
          pnpm install --frozen-lockfile
          pnpm build
          pnpm package
          (cd release && sha256sum cointrunk-wallet-*-chrome.zip cointrunk-wallet-*-firefox.zip) > "$RUNNER_TEMP/source.sha256"

      - name: Compare hashes
        run: |
          echo "checkout:";       cat "$RUNNER_TEMP/checkout.sha256"
          echo "source package:"; cat "$RUNNER_TEMP/source.sha256"
          if ! cmp -s "$RUNNER_TEMP/checkout.sha256" "$RUNNER_TEMP/source.sha256"; then
            echo "::error::The rebuild from the source package differs from the checkout build"
            exit 1
          fi
          {
            echo "### Reproducible build"
            echo
            echo "Both store zips rebuilt from the source package with the same SHA-256:"
            echo
            echo '```'
            cat "$RUNNER_TEMP/checkout.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # PR-only: the store zips + source package, ready for a submission dry run.
      - name: Compute short commit SHA
        if: github.event_name == 'pull_request'
        id: short
        run: echo "sha=$(cut -c1-7 <<< '${{ github.event.pull_request.head.sha }}')" >> "$GITHUB_OUTPUT"

      - name: Upload release packages
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: cointrunk-release-${{ steps.short.outputs.sha }}
          path: release/
          if-no-files-found: error
